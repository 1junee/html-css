<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 내 CSS도 같이 쓰려면 Bootstrap link "아래"에 둘 것 → 나중에 불러온 쪽이 덮어씀 -->
    <!-- <link rel="stylesheet" href="mycss.css"> -->

    <!-- Bootstrap: 미리 만들어진 CSS 모음. 태그에 정해진 class 이름만 붙이면 디자인 적용 -->
    <!-- 6.0.0-alpha.1 = 정식 출시 전 시험판 → 문법이 v5와 다름 (예: col-md-6 → md:col-6) -->
    <!-- CSS: 디자인 담당 (이것만 있어도 대부분 작동) -->
    <!-- integrity/crossorigin: 받은 파일이 변조 안 됐는지 확인하는 보안 장치 → 건드리지 말 것 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- JS: 움직이는 기능 담당 (메뉴 열고 닫기, 드롭다운, 모달 등). 없으면 모양만 나오고 클릭해도 반응 없음 -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
    <!-- ⚠ 화면에 보이는 요소는 <body> 안에 있어야 정상. 이 nav는 <body> 아래로 옮기는 게 맞음 -->

    <!-- navbar: 페이지 상단 바 전체 (로고 + 메뉴). nav는 메뉴 링크 목록만
         <nav> 태그 = "이동 메뉴"라는 의미(시맨틱), class="navbar" = Bootstrap 디자인
         sm:navbar-expand = sm(576px) 이상에선 메뉴 펼침, 더 좁으면 ☰ 버튼으로 접힘 -->
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
        <!-- navbar-brand: 왼쪽 로고/사이트 이름 -->
        <a class="navbar-brand" href="#">Blog</a>
        <!-- navbar-toggler: 좁은 화면에서 보이는 ☰ 버튼
             data-bs-toggle="drawer" = 누르면 drawer(옆에서 나오는 패널)를 열어라
             data-bs-target="#navbarNav" = 열 대상 (#은 id → 아래 dialog의 id와 같아야 함)
             aria-* = 스크린리더용 정보 -->
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <!-- drawer: 옆에서 밀려 나오는 메뉴 패널 (drawer-end = 오른쪽에서) -->
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
        <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <!-- btn-close: X 버튼. data-bs-dismiss="drawer" = 누르면 drawer 닫기 -->
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
            <!-- navbar-nav > nav-item > nav-link: 메뉴 목록 구조 -->
            <ul class="navbar-nav">
            <li class="nav-item">
                <!-- active = 현재 페이지 표시 -->
                <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
            </li>
            <li class="nav-item">
                <!-- disabled = 회색 처리, 클릭 안 됨 -->
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
            </ul>
        </div>
        </dialog>
    </div>
    </nav>
<body>
    <!-- container: 가운데 정렬 + 화면 크기별 고정 폭 상자 (container-fluid = 항상 폭 100%) -->
    <div class="container">
        <!-- class 여러 개는 한 따옴표 안에서 띄어쓰기로 구분
             class="card" mb-5 처럼 따옴표 밖에 쓰면 적용 안 됨 (값 없는 속성으로 인식) -->
        <!-- d-flex = display: flex / justify-content-between = 양 끝 배치 / align-items-center = 세로 가운데
             여백: m=margin, p=padding / t·b·s·e·x·y=방향(위·아래·시작·끝·가로·세로) / 숫자=크기
             mb-5 = 아래쪽 바깥 여백, p-8 = 안쪽 여백 전체 -->
        <header class="d-flex justify-content-between mb-5 p-8 align-items-center">
            <h1>게시판</h1>
            <a href="write.html" target="_blank">글작성</a>
        </header>

        <main>
            <!-- card: 테두리 있는 상자 (직접 만든 .post 액자와 비슷)
                 card-body: 안쪽 여백 / card-title: 제목 / card-text: 본문 -->
            <div class="card mb-5 p-8">
                <div class="card-body">
                    <h2 class="card-title">첫 게시물</h2>
                    <p class="card-text">첫 글입니다!!</p>
                    <!-- btn-solid theme-primary: 꽉 찬 기본색 버튼 (v6 문법. v5에선 btn btn-primary) -->
                    <a href="" class="btn-solid theme-primary">상세보기</a>
                </div>
            </div>
            <div class="card mb-5 p-8">
                <!-- 고정 width="500"이라 좁은 화면에서 카드 밖으로 넘칠 수 있음 → class="img-fluid" 고려 -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9OEpBkVQ04XYMf6vkMjWyMDhN0OM0tdO3qcrwgbq71Wcym72ppO_H-5K2&s=10" alt="??" width="500" height="300"/>
                <h2 class="card-title">오늘 <b id="lunch">점심</b> 뭐먹을까요?</h2>
                <p class="card-text">추천 좀 해주세요</p>
            </div>
        </main>

        <!-- 그리드 시스템: container > row > col
             row = 한 줄을 12칸으로 나눔. 칸 합이 12 넘으면 다음 줄로 넘어감
             col = 남은 공간 균등 분배 / col-N = 12칸 중 N칸 / col-auto = 내용 크기만큼
             반응형(v6): md:col-4 = md(768px) "이상"에서만 4칸. 접두사 없으면 모든 폭에 적용
               브레이크포인트: sm 576 / md 768 / lg 1024 / xl 1280 / 2xl 1536 (px 이상)
             row에 붙이는 것: row-cols-N = 한 줄에 N개씩 (md:row-cols-2 처럼 반응형 가능)
                             g-3 = 칸 사이 간격 (gx 가로만, gy 세로만, g-0 없음)
             중첩: col 안에 다시 row 넣으면 그 안에서 또 12칸 -->
        <div class="row">
            <!-- block 속성들 (div는 블록 요소지만 row 안에선 col 비율대로 가로로 나란히) -->
            <!-- 768px 미만: 2 + 6 + 3 = 11칸 / 768px 이상: 4 + 4 + 4 = 12칸 (3등분) -->
            <div class="col-2 md:col-4">box1</div>
            <div class="col-6 md:col-4">box2</div>
            <div class="col-3 md:col-4">box3</div>
            <!-- <div class="col">box4</div> -->
            <!-- <div class="col">box5</div> -->
        </div>




    </div>


</body>
</html>
